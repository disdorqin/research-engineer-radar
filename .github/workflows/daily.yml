name: Research Engineer Radar Daily

on:
  workflow_dispatch:
  schedule:
    # 08:30 Asia/Shanghai = 00:30 UTC
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Run radar
        run: python -m radar.main --config config/radar.json

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-digest
          path: reports/*.md
          if-no-files-found: warn

      - name: Persist seen state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json reports/*.md || true
          git diff --cached --quiet || git commit -m "chore: update radar state and digest"
          git push
