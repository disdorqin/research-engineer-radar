[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engineer-radar"
version = "0.1.0"
description = "A lightweight daily radar for AI research engineering signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
radar = "radar.main:main"

[tool.setuptools.packages.find]
where = ["src"]
